<style>
  /*
   * src/html/CommonStyles.html
   *
   * Shared styles used by all application views and dialogs.
   *
   * Contains:
   * - Theme variables
   * - Typography defaults
   * - Layout primitives
   * - Buttons
   * - Status messages
   * - Form controls
   * - Utility classes
   *
   * View-specific styles belong in:
   * - ImportExportStyles.html
   * - QuickEntryStyles.html
   */

  /* Global theme values and reusable sizing tokens. */
  :root {
    --border: #c6cacc;
    --text: #202124;
    --muted: #5f6368;
    --bg-soft: #f8f9fa;
    --primary: #1a73e8;
    --primary-hover: #1765cc;
    --success: #137333;
    --error: #c5221f;
    --warning: #b06000;
    --font-mono: Consolas, "Courier New", monospace;
    --text-2xs: 10px;
    --text-xs: 12px;
    --text-sm: 13px;
    --text-md: 14px;
    --text-lg: 16px;
    --text-xl: 18px;
    --text-2xl: 22px;
  }

  /* Uses predictable sizing for all elements. */
  * {
    box-sizing: border-box;
  }

  /* Defines the shared application font and colors. */
  body {
    font-family: Arial, sans-serif;
    color: var(--text);
    background: #fff;
  }

  /* Provides the shared vertical layout container. */
  .container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Defines the shared bordered content section. */
  .section {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    background: #fff;
  }

  /* Defines the shared button appearance. */
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Highlights enabled buttons on hover. */
  .btn:hover:not(:disabled) {
    background: var(--bg-soft);
  }

  /* Reduces emphasis and disables interaction for disabled buttons. */
  .btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  /* Defines the primary action button. */
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* Defines the primary button hover state. */
  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  /* Defines toggle-style filter buttons. */
  .btn-filter {
    font-weight: 600;
  }

  /* Highlights an active filter button. */
  .btn-filter.active {
    border-color: var(--primary);
    color: var(--primary);
  }

  /* Defines compact buttons used beside labels or titles. */
  .btn-inline {
    padding: 3px 10px;
    font-size: var(--text-xs);
  }

  /* Defines the shared status message area. */
  .message {
    min-height: 20px;
    font-size: var(--text-sm);
    white-space: pre-wrap;
    margin-top: 4px;
  }

  /* Defines success message color. */
  .message.success {
    color: var(--success);
  }

  /* Defines error message color. */
  .message.error {
    color: var(--error);
  }

  /* Defines informational message color. */
  .message.info {
    color: var(--muted);
  }

  /* Defines warning message color. */
  .message.warning {
    color: var(--warning);
  }

  /* Defines the shared message container layout. */
  .message-section {
    max-height: 220px;
    overflow-y: auto;
  }

  /* Hides elements without removing them from the DOM. */
  .hidden {
    display: none !important;
  }

  /* Defines inline formatted code blocks. */
  .inline-code {
    font-family: var(--font-mono);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    color: var(--text);
  }

  /* Defines shared label formatting. */
  label {
    display: inline-block;
    margin-bottom: 6px;
    font-weight: 600;
  }

  /* Defines secondary informational text. */
  .hint {
    font-size: var(--text-xs);
    color: var(--muted);
    line-height: 1.5;
  }

  /* Keeps form controls consistent with application typography. */
  input,
  select,
  textarea,
  button {
    font: inherit;
  }

  /* Defines shared select control sizing. */
  select {
    width: 100%;
    padding: 8px;
  }

  /* Defines reusable form input styling. */
  .form-control {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  /* Adds spacing for About view content. */
  .about-card {
    padding: 10px 16px;
  }

  /* Defines the About view table layout. */
  .about-table {
    border-collapse: collapse;
    margin: 0;
  }

  /* Defines About table header cells. */
  .about-table th {
    text-align: left;
    vertical-align: top;
    font-weight: 600;
    padding: 4px 8px 4px 0;
    white-space: nowrap;
    width: 120px;
  }

  /* Defines About table data cells. */
  .about-table td {
    padding: 4px 0;
    text-align: left;
    font-size: var(--text-sm);
  }

  /* Allows long links to wrap inside About tables. */
  .about-table a {
    word-break: break-word;
  }
</style>
