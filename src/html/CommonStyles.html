<style>
  /* src/html/CommonStyles.html
   * Shared styles used by all dialogs in the application.
   * Contains:
   * - Theme variables
   * - Typography
   * - Font sizes
   * - Layout primitives
   * - Buttons
   * - Messages
   * - Form controls
   * - Utility classes
   * Dialog-specific styles belong in:
   * - ImportExportStyles.html
   * - QuickEntryStyles.html
 */
  :root {
    --border: #c6cacc;
    /*darker border for better contrast*/
    --text: #202124;
    --muted: #5f6368;
    --bg-soft: #f8f9fa;
    --primary: #1a73e8;
    --primary-hover: #1765cc;
    --success: #137333;
    --error: #c5221f;
    --warning: #b06000;
    --font-mono: Consolas, "Courier New", monospace;
    --text-2xs: 10px;
    --text-xs: 12px;
    --text-sm: 13px;
    --text-md: 14px;
    --text-lg: 16px;
    --text-xl: 18px;
    --text-2xl: 22px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    color: var(--text);
    background: #fff;
  }

  .container {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .section {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    background: #fff;
  }

  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }

  .btn:hover:not(:disabled) {
    background: var(--bg-soft);
  }

  .btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }

  /* A button variant used for filter options, which can be toggled on/off. */
  .btn-filter {
    font-weight: 600;
  }

  /* Active state for filter buttons. */
  .btn-filter.active {
    border-color: var(--primary);
    color: var(--primary);
  }

  /* status messages (single line feedback) */
  .message {
    min-height: 20px;
    font-size: var(--text-sm);
    white-space: pre-wrap;
    margin-top: 4px;
  }

  .message.success {
    color: var(--success);
  }

  .message.error {
    color: var(--error);
  }

  .message.info {
    color: var(--muted);
  }

  .message.warning {
    color: var(--warning);
  }

  .hidden {
    display: none !important;
  }

  .inline-code {
    font-family: var(--font-mono);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    color: var(--text);
  }

  label {
    display: inline-block;
    margin-bottom: 6px;
    font-weight: 600;
  }

  /* secondary informational text, used for hints and messages,etc. */
  .hint {
    font-size: var(--text-xs);
    color: var(--muted);
    line-height: 1.5;
  }

  input,
  select,
  textarea,
  button {
    font: inherit;
  }

  select {
    width: 100%;
    padding: 8px;
  }

  .form-control {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  /* About view content */
  .about-card {
    padding: 10px 16px;
  }

  .about-table {
    border-collapse: collapse;
    margin: 0;
  }

  .about-table th {
    text-align: left;
    vertical-align: top;
    font-weight: 600;
    padding: 4px 8px 4px 0;
    white-space: nowrap;
    width: 120px;
  }

  .about-table td {
    padding: 4px 0;
    text-align: left;
    font-size: var(--text-sm);
  }

  /* Links in the About view table should break if they are too long. */
  .about-table a {
    word-break: break-word;
  }
</style>
