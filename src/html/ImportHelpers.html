<script>
  // src/html/ImportHelpers.html
  /**
   * Import-related UI helpers and utilities.
   * Contains:
   * - pure data transformation helpers
   * - DOM rendering helpers shared by Import views
   * Functions accept optional dependencies where possible
   * to allow unit testing without a browser environment.
   * NOTE: the export tag in comments indicates methods that are intended to be testable and exposed for
   * external use, so they should not be removed or altered without consideration of their role in the overall
   * application architecture.
   */

  /**
   * Namespace for import-related helpers and utilities. Using namespace to avoid polluting the global
   * scope and to provide a clear structure for import-related functions.
   * Functions exported from the namespace are tagged with @export for identification and documentation; the
   * leading-underscore naming convention (not a JSDoc tag) is what marks a function as private.
   */
  window.Import = (function () {

    /**
     * Reads current UI state from DOM inputs.
     * The mode value is part of the import payload contract.
     * It must always be read from the live DOM element because the
     * Import dialog can be opened with a different default mode
     * (for example: replace_countries) through window.importConfig.
     * Do not cache the mode value at namespace initialization time.
     * @export
     */
    function getUIState(deps = {}) {
      const doc = deps.document || (typeof document !== 'undefined' ? document : null)
      const textEl = deps.textInput || (doc && doc.getElementById('textInput'))
      const modeEl = deps.modeInput || (doc && doc.getElementById('mode'))
      return {
        text: textEl ? textEl.value : '',
        mode: modeEl ? modeEl.value : 'update'
      }
    }

    /** Backend payload wrapper (stable contract for services).
     * @export
     */
    function getPayload(deps = {}) {
      return getUIState(deps)
    }

    /** Clears preview output area.
     * @export
     */
    function clearPreview(deps = {}) {
      const el = deps.previewEl || (typeof previewEl !== 'undefined' ? previewEl : null)
      if (!el) return
      if (el.classList) {
        el.classList.add('hidden')
      }
      el.style.display = 'none'
      el.textContent = ''
    }

    /** Renders preview content into UI.
     * @export
     */
    function renderPreview(result, deps = {}) {
      const el = deps.previewEl || (typeof previewEl !== 'undefined' ? previewEl : null)
      if (!el) return
      if (!result) {
        clearPreview({ previewEl: el })
        return
      }
      const text = _renderPreviewData(result)
      if (el.classList) {
        el.classList.remove('hidden')
      }
      el.textContent = text
      el.style.display = 'block'
    }

    /** Enables/disables UI during async operations. 
     * @export
     */
    function setBusy(isBusy, deps = {}) {
      const doc = deps.document || (typeof document !== 'undefined' ? document : null)
      const controls = deps.controls || [
        doc.getElementById('fileInput'),
        doc.getElementById('mode'),
        doc.getElementById('textInput')
      ].filter(Boolean)
      doc.querySelectorAll('button')
        .forEach(btn => { btn.disabled = isBusy })
      controls.forEach(el => { el.disabled = isBusy })
    }

    /** Displays a message in the dialog UI.
     * @export
     */
    function setMessage(text, type, deps = {}) {
      const el = deps.messageEl || (typeof messageEl !== 'undefined' ? messageEl : null)
      if (!el) { return }
      el.className = `message ${type || 'info'}`
      el.textContent = text || ''
    }

    // PRIVATE FUNCTIONS

    /** Converts backend export result into displayable text. */
    function _renderPreviewData(result) {
      if (!result || !result.countries || !result.countries.length) return ''

      return result.countries.map(country => {
        const stickerText = (country.stickers || [])
          .map(item => `${item.number}:${item.count}`)
          .join(', ')

        return `${country.code} -> ${stickerText}`
      }).join('\n')
    }


    return { // namespace export
      getUIState,
      getPayload,
      clearPreview,
      renderPreview,
      setBusy,
      setMessage
    }
  })()

</script>
