<style>
  /*
   * src/html/MobileTradeStyles.html
   *
   * Styles for the mobile Trade view.
   *
   * Shared styles come from:
   * - CommonStyles.html
   * - ImportExportStyles.html
   * - TradeStyles.html
   *
   * This file only contains mobile-specific Trade adjustments.
   */

  /*
   * Mobile Trade container.
   * Provides the mobile card layout used by the service view.
   */
  #view-trade {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /*
   * Trade QR generation toolbar.
   * Keeps Trade-specific toolbar controls aligned on mobile.
   */
  #view-trade .trade-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  /*
   * Inline actions beside "Another collector's trade information".
   * TradeView defines this container, but no shared style exists.
   */
  #view-trade .trade-information-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: nowrap;
  }

  #view-trade .trade-information-actions .btn-inline {
    min-width: 0;
    flex: 1 1 auto;
    padding: 10px 12px;
    font-size: var(--text-sm);
  }

  /*
   * Trade input areas.
   * Mobile needs larger touch-friendly text areas than desktop.
   */
  #view-trade .trade-textarea {
    min-height: 320px;
    font-size: var(--text-lg);
    padding: 14px;
  }

  /*
   * Import hint spacing.
   * Keeps the explanation separated from the input controls.
   */
  #view-trade .trade-import-hint {
    margin-bottom: 10px;
  }

  /*
   * Trade proposal card.
   * Keeps proposal content readable on smaller screens.
   */
  #view-trade .proposal-container {
    padding: 12px;
    margin-bottom: 16px;
  }

  /*
 * Trade quantity selectors. Displays the receive and send selectors side-by-side.
 * Control the separation between the two selectors with the gap property.
 */
  #view-trade .proposal-limits {
    display: flex;
    gap: 20px;
  }

  /*
 * Container for each trade quantity selector.
 * Keeps label and dropdown aligned horizontally.
 */
  #view-trade .proposal-limit {
    flex: 1;
    display: flex;
    align-items: center;
  }

  /* Label for each trade quantity selector.
   * Keeps the label width based on its content so the dropdown
   * can be positioned closer to it.
   */
  #view-trade .proposal-limit label {
    flex: 0 0 auto;
    margin-bottom: 0;
    white-space: nowrap;
  }

  /*
   * Dropdown selector for each trade quantity.
   * Provides enough width for two-digit quantities on mobile.
   */
  #view-trade .proposal-limit select {
    width: 110px;
    flex: 0 0 110px;
    height: 44px;
    min-height: 44px;
    padding: 6px 10px;
    margin-left: 18px;
    padding-left: 10px;
    padding-right: 10px;
  }

  /* Scrollable container for the proposal preview. */
  #view-trade .proposal-preview {
    overflow-y: auto;
    margin-top: 8px;
    line-height: 1.4;
    -webkit-overflow-scrolling: touch;
  }

  /* Keeps long validation preview content contained inside the gray preview box. */
  #view-trade #trade-preview,
  #view-trade #tradeQrInfo {
    max-height: 280px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: block;
    width: 100%;
    line-height: 1.4;
  }

  /* Highlights stickers included in the current trade proposal. */
  #view-trade .trade-highlight {
    background: #d9f2d9;
    border-radius: 4px;
    padding: 1px 4px;
    font-weight: 600;
  }

  /*
   * Trade proposal legend.
   * Adds spacing so the legend does not appear cramped.
   */
  #view-trade #proposalLegend {
    margin-top: 6px;
  }

  /* Centers the generated QR code horizontally. */
  .qr-container {
    display: flex;
    justify-content: center;
  }

  /* Fixed display size for generated QR code. */
  .trade-qr-image {
    width: min(98vw, 640px);
    height: min(98vw, 640px);
    display: none;
  }

  /*
   * Receive section header + sort control on one line.
   * Matches desktop behavior while keeping mobile spacing readable.
   */
  #view-trade .receive-header-inline {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    flex-wrap: nowrap;
  }

  /*
   * Inline sort block beside the receive title.
   * Keeps label vertically centered with the dropdown.
   */
  #view-trade .receive-sort-inline {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Sort label alignment fix for shared label default spacing. */
  #view-trade .receive-sort-inline label {
    margin-bottom: 0;
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }

  /*
   * Compact sort dropdown for mobile Trade view only.
   * Does not affect receive/send quantity selectors.
   */
  #view-trade .trade-sort-mode-select {
    width: 220px;
    height: 44px;
    min-height: 44px;
    padding: 6px 10px;
    font-size: var(--text-md);
    line-height: 1.2;
  }

  /* Keeps Trade validation warnings stacked like desktop instead of one-line flex layout. */
  #view-trade #trade-warnings {
    display: block;
  }

  /* Restores readable paragraph spacing for warning lines. */
  #view-trade #trade-warnings p {
    margin: 4px 0;
    line-height: 1.4;
  }

  /* Emphasizes section headers (Repeats, Missing) if they are first paragraph in each warning block. */
  #view-trade #trade-warnings p:first-child {
    margin-top: 8px;
    margin-bottom: 4px;
    font-weight: 700;
  }

  /*
 * Separates consecutive sections within the mobile Trade workflow.
 * Keeps consistent vertical spacing between Trade sections.
 */
  #view-trade .section+.section {
    margin-top: 16px;
  }
</style>
