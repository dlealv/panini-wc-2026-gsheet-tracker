<style>
  /* 
  src/html/ImportExportStyles.html
  CSS variables for consistent theming and easy maintenance. Only the style for Import/Export Dialogs 
  It contains: 
  - Theme variables
  - Typography
  - Layout primitives
  - Buttons
  - Messages
  - Form controls
  */
  
  /* Main dialog heading for import and export panels */
  h2 {
    margin: 0 0 12px 0;
    font-size: var(--text-2xl);
  }

  /* Section title used for grouped labels and inline icons */
  .section-title {
    margin: 0 0 10px 0;
    font-size: var(--text-md);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Hides empty section titles so spacing stays compact */
  .section-title:empty {
    display: none;
  }

  /* Label row keeps the label and inline action button on one line */
  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  /* Removes extra spacing from labels inside a label row */
  .label-row label {
    margin-bottom: 0;
  }

  /* File inputs stretch to the full dialog width */
  input[type="file"] {
    width: 100%;
    padding: 8px;
  }

  /* Textareas are sized for multiline input and preview content */
  textarea {
    width: 100%;
    min-height: 220px;
    padding: 10px;
    resize: vertical;
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }

  /* Export preview textarea gets more height for larger output */
  #exportText {
    min-height: 260px;
  }

  /* Checkbox inputs keep a small gap from their labels */
  input[type="checkbox"] {
    margin-right: 6px;
  }

  /* Disabled controls use muted colors to indicate inactive state */
  textarea:disabled,
  select:disabled,
  input[type="file"]:disabled {
    background: #f1f3f4;
    color: #5f6368;
  }

  /* Helper list shown below action buttons */
  .actions-help {
    margin: 8px 0 0 18px;
    padding: 0;
  }

  /* Spacing between helper list items */
  .actions-help li {
    margin: 4px 0;
  }

  /* Checkbox row keeps option spacing tight and aligned */
  .checkbox-row {
    margin-top: 4px;
    /* was 10px */
  }

  /* Checkbox labels align the control and text in a single row */
  .checkbox-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 0;
    font-weight: 500;
  }

  /* Tightens checkbox alignment inside checkbox rows */
  .checkbox-row input[type="checkbox"] {
    margin: 0;
  }

  /* Toolbar layout for export controls and status items */
  .export-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  /* Small inline item inside the toolbar */
  .toolbar-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: var(--text-xs);
    font-weight: 700;
    color: var(--muted);
  }

  /* Action button row for primary dialog actions */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Hidden preview panel used for formatted output */
  .preview {
    display: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-soft);
    padding: 10px;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  /* Borderless help button used as an inline info icon */
  .help-btn {
    border: none;
    background: none;
    color: var(--primary);
    cursor: pointer;
    font-size: var(--text-lg);
    padding: 0 2px;
    font-weight: 700;
    line-height: 1;
  }

  /* Hover state for the help icon button */
  .help-btn:hover {
    color: var(--primary-hover);
    transform: scale(1.08);
  }

  /* Summary card showing export/import format details */
  .format-card {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-xs);
    margin-top: 4px;
  }

  /* Header cells for the format summary table */
  .format-card th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    padding: 3px 8px 3px 0;
    border-bottom: 1px solid var(--border);
  }

  /* Body cells for the format summary table */
  .format-card td {
    padding: 4px 8px 4px 0;
    vertical-align: top;
  }

  /* Small informational line shown below the actions area */
  .tip-row {
    margin-top: 10px;
    font-size: var(--text-xs);
    color: var(--muted);
  }

  /* Adds spacing when a hint block needs separation */
  .hint-spaced {
    margin-top: 8px;
  }

  /* Header row inside the help modal keeps title and link aligned */
  .help-header {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Modal title uses a slightly smaller size to fit the inline link */
  .help-header h3 {
    margin: 0;
    line-height: 1.1;
    font-size: var(--text-xl);
    /* optional slight reduction */
  }

  /* Dialog base styling for the help modal */
  dialog {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    max-width: 500px;
    width: 95%;
    font-size: var(--text-sm);
    color: var(--text);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  }

  /* Backdrop overlay for the modal dialog */
  dialog::backdrop {
    background: rgba(0, 0, 0, 0.35);
  }

  /* Modal heading style for consistency with dialog content */
  dialog h3 {
    margin: 0 0 12px 0;
    font-size: var(--text-lg);
  }

  /* Short note shown above the format sections inside the modal */
  dialog .modal-note {
    font-size: var(--text-xs);
    color: var(--muted);
    margin-bottom: 12px;
    line-height: 1.6;
  }

  /* Collapsible detail blocks inside the modal for each format section */
  dialog details {
    margin-bottom: 10px;
  }

  /* Summary row for each collapsible detail block */
  dialog summary {
    font-weight: 700;
    cursor: pointer;
    padding: 4px 0;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Custom triangle marker shown before each summary */
  dialog summary::before {
    content: '▶';
    font-size: var(--text-2xs);
    color: var(--muted);
    transition: transform 0.15s;
  }

  /* Rotates the triangle when a detail block is open */
  dialog details[open] summary::before {
    transform: rotate(90deg);
  }

  /* Body text inside the modal detail blocks */
  dialog .modal-body {
    padding: 8px 0 4px 14px;
    line-height: 1.7;
    color: var(--muted);
  }

  /* Footer row that aligns modal actions to the right */
  dialog .modal-footer {
    margin-top: 14px;
    text-align: right;
  }
</style>
