<style>
  /*
   * src/html/MobileStyles.html
   * Shared mobile shell styles for the Panini WC 2026 web app.
   * This file keeps common layout, navigation, and utility styles used by
   * both import and export views. It contains:
   * - Theme variables
   * - Typography
   * - Layout primitives
   * - Buttons
   * - Messages
   * - Form controls 
   */
  :root {
    --border: #c6cacc;
    --text: #202124;
    --muted: #5f6368;
    --bg-soft: #f8f9fa;
    --primary: #1a73e8;
    --primary-hover: #1765cc;
    --success: #137333;
    --error: #c5221f;
    --warning: #b06000;
    --text-4xs: 12px;
    --text-3xs: 14px;
    --text-2xs: 16px;
    --text-xs: 20px;
    --text-sm: 26px;
    --text-md: 28px;
    --text-lg: 30px;
    --text-xl: 32px;
    --text-2xl: 36px;
    --text-3xl: 42px;
  }

  /* Reset box-sizing and remove default margin and padding for all elements. */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Set default font family, size, color, and background for the body. */
  body {
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Helvetica,
      Arial,
      sans-serif;
    font-size: var(--text-md);
    color: var(--text);
    background: #f0f4f8;
    margin: 0;
    padding: 0;
  }

  /* The mobile page container takes full width and has bottom padding to avoid content being hidden behind fixed elements. */
  .mobile-page {
    width: 100%;
    padding-bottom: 24px;
  }

  /* The mobile page container takes full width and has bottom padding to avoid content being hidden behind fixed elements. */
  .header {
    background: var(--primary);
    color: #fff;
    padding: 16px;
  }

  /* The mobile page header title is large and bold, with padding to align with the menu button. */
  .header-title {
    font-size: var(--text-2xl);
    font-weight: 700;
    padding-left: 46px;
    line-height: 1.2;
  }

  /* The mobile page header subtitle is smaller and slightly transparent, with padding to align with the menu button. */
  .header-sub {
    font-size: var(--text-sm);
    opacity: 0.85;
    padding-left: 46px;
    margin-top: 2px;
  }

  /* The mobile view container takes full width and height, with padding to avoid content being hidden behind fixed elements. */
  .view {
    width: 100%;
  }

  /* The main content area of the mobile view has padding and uses flex layout to arrange its children vertically with gaps. */
  main {
    padding: 4px 12px 12px;
    padding-bottom: 80px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* The mobile drawer is a fixed-position sidebar that slides in from the left, with a white background, border, padding, and shadow. */
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    width: 200px;
    max-width: 75vw;
    height: 100%;
    background: white;
    border-right: 1px solid #ddd;
    padding: 16px;
    z-index: 1000;
    box-shadow: 3px 0 12px rgba(0, 0, 0, .25);
  }

  /* The mobile drawer items are styled as clickable list items with padding and a pointer cursor. */
  .drawer-item {
    font-size: var(--text-lg);
    padding: 18px;
    cursor: pointer;
  }

  /* The mobile drawer items change background color on hover to indicate interactivity. */
  .drawer-item:hover {
    background: #f5f5f5;
  }

  /* The mobile drawer items have a bottom border to separate them visually. */
  .menu-btn {
    position: absolute;
    left: 12px;
    top: 10px;
    width: 44px;
    height: 44px;
    min-width: 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: white;
    font-size: var(--text-3xl);
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }

  /* The mobile drawer overlay is a semi-transparent layer that covers the main content when the drawer is open, 
  allowing users to click outside the drawer to close it. */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    z-index: 999;
  }

  /* Standard mobile button used throughout the application. */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--text);
    font-size: var(--text-lg);
    min-height: 60px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }

  /* Standard mobile button used throughout the application. Hover state. */
  .btn:active {
    opacity: 0.75;
  }

  /* Standard mobile button used throughout the application. Disabled state. */
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Primary action button with a solid background color and white text. */
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* Primary action button with a solid background color and white text. Hover state. */
  .btn-primary:active {
    background: var(--primary-hover);
  }

  /* Secondary action button with a white background and muted text color. */
  .btn-secondary {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  /* Small inline action button used beside section titles. */
  .btn-inline {
    width: auto;
    flex: 0 0 auto;
    margin-left: auto;
    min-width: 140px;
    min-height: 44px;
    padding: 10px 18px;
    font-size: var(--text-md);
    font-weight: 700;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }

  /* Small inline action button used beside section titles. Hover state. */
  .btn-inline:hover:not(:disabled) {
    background: #f1f3f4;
  }

  /* Small inline action button used beside section titles. Disabled state. */
  .message {
    padding: 12px;
    border-radius: 8px;
    font-size: var(--text-sm);
    min-height: 44px;
    display: flex;
    align-items: center;
    white-space: pre-wrap;
  }

  /* Shared message styles for success, error, info, and warning messages. */
  .message:empty {
    display: none;
  }

  /* Shared message styles for success, error, info, and warning messages. */
  .message.success {
    background: #e6f4ea;
    color: var(--success);
  }

  /* Shared message styles for success, error, info, and warning messages. */
  .message.error {
    background: #fce8e6;
    color: var(--error);
  }

  /* Shared message styles for success, error, info, and warning messages. */
  .message.info {
    background: var(--bg-soft);
    color: var(--muted);
  }

  /* Shared message styles for success, error, info, and warning messages. */
  .message.warning {
    background: #fff8e1;
    color: var(--warning);
  }

  /* Paragraph spacing inside warning messages. */
  #view-import .warnings p {
    margin: 3px 0;
  }

  /* Defines the shared message container layout. */
  .message:empty {
    display: none;
  }

  /* Defines the shared message container layout. */
  .message-section {
    max-height: 280px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Utility class to hide elements. */
  .hidden {
    display: none !important;
  }

  /* Standard section heading. */
  .section-title {
    font-size: var(--text-xl);
    font-weight: 700;
    margin-bottom: 8px;
  }

  /* Style for inline code snippets. */
  .inline-code {
    font-family: Consolas, "Courier New", monospace;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
  }

  /* Style for code preview blocks. */
  .preview {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 280px;
    padding: 12px;
    /* font-size: var(--text-sm); */
    font-size: var(--text-2xs);
    font-family: Consolas, "Courier New", monospace;
    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: pre-wrap;
  }

  /* Standard form labels. */
  label {
    display: inline-block;
    margin-bottom: 8px;
    font-size: var(--text-md);
    font-weight: 600;
  }

  /* Secondary informational text. */
  .hint {
    font-size: var(--text-sm);
    color: var(--muted);
    line-height: 1.6;
  }

  /* Secondary informational text. */
  .toolbar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--muted);
  }

  /* Secondary informational text. */
  .toolbar-item input[type="checkbox"] {
    width: 22px;
    height: 22px;
    margin: 0;
    flex: 0 0 auto;
  }

  /* Section heading with actions aligned to the right. */
  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  /* Section heading with actions aligned to the right. */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Section heading with actions aligned to the right. */
  .actions .btn {
    flex: 1 1 140px;
  }

  /* Shared mobile form controls. */
  .form-control,
  input,
  textarea,
  select {
    width: 100%;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-size: var(--text-lg);
  }

  /* Shared mobile form controls. */
  input,
  select,
  textarea,
  button {
    font: inherit;
  }

  /* Shared mobile form controls. */
  @supports (-webkit-touch-callout: none) {
    body {
      min-height: -webkit-fill-available;
    }
  }

  /* Mobile about view no need to create a specific file for About page*/
  .about-table {
    width: 100%;
    border-collapse: collapse;
  }

  /* Mobile about view no need to create a specific file for About page*/
  .about-table th {
    text-align: left;
    vertical-align: top;
    font-size: var(--text-md);
    font-weight: 600;
    padding: 6px 12px 6px 0;
    white-space: nowrap;
  }

  /* Mobile about view no need to create a specific file for About page*/
  .about-table td {
    font-size: var(--text-md);
    font-weight: 400;
    padding: 6px 0;
  }

  /* Mobile about view no need to create a specific file for About page*/
  .about-table a {
    font-size: var(--text-md);
  }
</style>
