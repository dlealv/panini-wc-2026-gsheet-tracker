<script>
  // src/html/TradeHelpers.html

  /**
   * Pure functions (testable) related to trade dialog logic.
   *
   * This helper supports TradeDialog.html and contains:
   * - trade payload generation
   * - UI state extraction
   * - message handling
   *
   * NOTE: the export tag in comments indicates methods that are intended to be
   * testable and exposed for external use, so they should not be removed or
   * altered without consideration of their role in the overall application
   * architecture.
   */

  /** 
   * Namespace for export-related helpers and utilities. Using namespace to avoid polluting the global 
   * scope and to provide a clear structure for export-related functions.
   * Functions exported from the namespace are tagged with @public to easy identification and documentation.
   */
  window.Trade = (function () {

    /**
     * Builds the trade selection options from the current UI state.
     * @export
     * @public
     */
    function getPayload(deps = {}) {
      return _getUIState(deps)
    }

    /**
     * Enables/disables UI during async operations.
     * @export
     * @public
     */
    function setBusy(isBusy, deps = {}) {
      const doc = deps.document || document
      doc.querySelectorAll('button').forEach(btn => {
        btn.disabled = isBusy
      })
      const controls = deps.controls || [
        ...(typeof sortMissingCheckbox !== 'undefined'
          ? [sortMissingCheckbox]
          : []),
        ...(typeof receiveLimitSelect !== 'undefined'
          ? [receiveLimitSelect]
          : []),
        ...(typeof sendLimitSelect !== 'undefined'
          ? [sendLimitSelect]
          : [])
      ]
      controls.forEach(control => {
        if (control) {
          control.disabled = isBusy
        }
      })
    }

    /**
     * Displays a message in the Trade dialog UI.
     * @export
     * @public
     */
    function setMessage(text, type, deps = {}) {
      const el = deps.messageEl || (typeof tradeMessageEl !== 'undefined' ? tradeMessageEl : null)
      if (!el) return
      el.className = 'message ' + (type || 'info') // avoid using ${} notation
      el.textContent = text || ''
    }

    /**
     * Shows or hides the Trade message section.
     * @export
     * @public
     */
    function showMessage(show, deps = {}) {
      const el = deps.messageSectionEl || (typeof tradeMessageSectionEl !== 'undefined' ? tradeMessageSectionEl : null)
      if (!el) return
      el.style.display = show ? '' : 'none'
    }

    /**
     * Builds the backend payload from the Trade input fields.
     * @export
     * @public
     */
    function getValidationPayload(deps = {}) {
      const missingEl = deps.missingText || (typeof missingTextEl !== 'undefined' ? missingTextEl : null)
      const repeatsEl = deps.repeatsText || (typeof repeatsTextEl !== 'undefined' ? repeatsTextEl : null)
      return {
        missingText: missingEl ? missingEl.value.trim() : '',
        repeatsText: repeatsEl ? repeatsEl.value.trim() : ''
      }
    }

    /**
    * Renders a preview of the trade info in the UI.
    * @param {{tradeInfo:{missing:Object<string,number[]>,repeats:Object<string,number[]>}}} result
    * @param {Object} deps
    * @param {HTMLElement} deps.previewEl - The element to render the preview into.
    * @export
    * @public
    */
    function renderPreview(result, deps = {}) {
      const el = deps.previewEl
      if (!el) return
      el.className = 'preview'
      el.textContent = _formatTradeInfo(result.tradeInfo || {})
      el.style.display = 'block'
    }

    /**
     * Clears the trade preview display.
     * @param {Object} deps
     * @param {HTMLElement} deps.previewEl - The element to clear the preview from.
     * @export
     * @public
     */
    function clearPreview(deps = {}) {
      const el = deps.previewEl
      if (!el) return
      el.style.display = 'none'
      el.textContent = ''
    }

    /**
     * Clears the QR code preview display.
     * @param {Object} deps
     * @param {HTMLImageElement} deps.qrEl - The image element to clear the QR code from.
     * @param {HTMLElement} deps.messageEl - The element to clear the trade info message from.
     * @export
     * @public
     */
    function clearQrPreview(elements = {}) {
      if (!elements.qrEl) {
        return
      }
      elements.qrEl.src = ''
      elements.qrEl.style.display = 'none'
      if (elements.messageEl) {
        elements.messageEl.textContent = ''
        elements.messageEl.className = ''
        elements.messageEl.style.display = 'none'
      }
      if (elements.infoEl) {
        elements.infoEl.textContent = ''
        elements.infoEl.style.display = 'none'
      }
    }

    /**
     * Renders a QR code preview for the trade info in the UI.
     * @param {{qrData:string,tradeInfo:{missing:Object<string,number[]>,repeats:Object<string,number[]>}}} result
     * @param {Object} deps
     * @param {HTMLImageElement} deps.qrEl - The image element to render the QR code into.
     * @param {HTMLElement} deps.infoEl - The element to render the trade info message into.
     * @export
     * @public
     */
    function renderQrPreview(result, elements) {
      if (!elements.qrEl) { return }
      elements.qrEl.onload = function () {
        elements.qrEl.style.display = 'block'
        if (elements.hintEl) {
          elements.hintEl.style.display = 'block'
        }
      }
      elements.qrEl.src = _buildQrImageUrl(result.qrData)
      if (elements.infoEl) {
        elements.infoEl.className = 'preview'
        elements.infoEl.textContent = _formatTradeInfo(result.tradeInfo || {})
        elements.infoEl.style.display = 'block'
      }
    }

    /**
     * Renders receive/send match previews with optional proposal highlighting.
     * @param {{receive:Object<string,number[]>,send:Object<string,number[]>}} matches
     * @param {Object} deps
     * @param {HTMLElement} deps.receivePreviewEl
     * @param {HTMLElement} deps.sendPreviewEl
     * @param {{receive:Object<string,number[]>,send:Object<string,number[]>}} deps.highlightProposal
     * Current selected proposal stickers to highlight.
     * @export
     * @public
     */
    function renderMatches(matches, deps = {}) {
      if (!matches) { return }
      const receiveEl = deps.receivePreviewEl
      const sendEl = deps.sendPreviewEl
      const highlightProposal = deps.highlightProposal || null
      if (receiveEl) {
        receiveEl.className = 'preview'
        receiveEl.innerHTML = _formatMatches(matches.receive,
          highlightProposal ? highlightProposal.receive : null)
        receiveEl.style.display = 'block'
      }
      if (sendEl) {
        sendEl.className = 'preview'
        sendEl.innerHTML = _formatMatches(matches.send,
          highlightProposal ? highlightProposal.send : null)
        sendEl.style.display = 'block'
      }
    }

    /**
    * Formats trade input data into a string suitable for display in text areas.
    * @param {Object<string,number[]>} data
    * @returns {string}
    * @export
    * @public
    */
    function formatTradeInput(data) {
      return Object.keys(data || {})
        .map(country => country + ',' + data[country].join(','))
        .join('\n')
    }

    /**
     * Formats a sticker map into a readable string.
     * @param {Object<string,number[]>} data
     * @returns {string}
     * @public
     * @export
     */
    function formatStickerMap(data) {
      const lines = []
      const countries = Object.keys(data || {})
      if (!countries.length) { return '(none)' }
      countries.forEach(country => {
        lines.push(country + ' -> ' + data[country].join(', '))
      })

      return lines.join('\n')
    }

    /**
     * Counts the total number of sticker matches in a trade direction.
     * @param {Object<string,number[]>} matches
     * @returns {number}
     * @export
     * @public
     */
    function countMatches(matches) {
      return Object.values(matches || {})
        .reduce((total, stickers) => total + (stickers || []).length, 0)
    }

    // Private helper functions (not exported) for internal use within the Trade namespace.

    /**
     * Builds the QR image URL from encoded trade data.
     * @param {string} qrData
     * @returns {string}
     */
    function _buildQrImageUrl(qrData) {
      let url = 'https://quickchart.io/qr?text=' + encodeURIComponent(qrData) // avoid using ${} notation
      return url
    }

    /**
     * Reads the current trade options from the UI.
     * @returns {{sortMissing:boolean, maxStickerReceive:number,maxStickerSend:number}}
     */
    function _getUIState(deps = {}) {
      const sortCheckbox = deps.sortByCompletionCheckbox || document.getElementById('sortByCompletionCheckbox')
      const receiveSelect = deps.receiveLimitSelect || document.getElementById('receiveLimitSelect')
      const sendSelect = deps.sendLimitSelect || document.getElementById('sendLimitSelect')
      return {
        sortMissing: !!(sortCheckbox && sortCheckbox.checked),
        maxStickerReceive: Number(receiveSelect ? receiveSelect.value : 0),
        maxStickerSend: Number(sendSelect ? sendSelect.value : 0)
      }
    }

    /**
     * Formats TradeInfo into a readable message. 
     * Used to format other trade info (missing/repeats from another collector)
     * @param {{missing:Object<string,number[]>,repeats:Object<string,number[]>}} tradeInfo
     * @returns {string}
     */
    function _formatTradeInfo(tradeInfo) {
      const lines = []
      const appendSection = (title, data) => {
        lines.push(title)
        const countries = Object.keys(data || {})
        if (!countries.length) {
          lines.push('(none)')
          return
        }
        countries.forEach(country => {
          lines.push(country + ' -> ' + data[country].join(', ')) // avoid using ${} notation
        })
      }
      appendSection('Repeats:', tradeInfo.repeats)
      appendSection('Missing:', tradeInfo.missing)
      return lines.join('\n')
    }

    /**
     * Formats trade matches for preview.
     * When highlight is provided, stickers included in the proposal are
     * wrapped with highlight markup while the remaining stickers are rendered
     * normally.
     * @param {Object<string,number[]>} matches Matches grouped by country code.
     * @param {Object<string,number[]>} [highlight] Optional stickers to highlight grouped by country code.
     * @returns {string}
     */
    function _formatMatches(matches, highlightProposal = null) {
      const countries = Object.keys(matches || {})
      if (!countries.length) {
        return '(none)'
      }
      return countries
        .map(country => {
          const stickers = matches[country].map(sticker => {
            const isHighlighted = highlightProposal &&
              highlightProposal[country] &&
              highlightProposal[country].includes(sticker)
            if (isHighlighted) {
              return '<span class="trade-highlight">' + sticker + '</span>'
            }
            return sticker
          })
          return country + ', ' + stickers.join(', ')
        })
        .join('<br>')
    }

    /**
     * Applies user-selected trade limits to calculated matches.
     * @param {{receive:Object<string,number[]>,send:Object<string,number[]>}} matches
     * @param {{maxStickerReceive:number,maxStickerSend:number}} options
     * @returns {{receive:Object<string,number[]>,send:Object<string,number[]>}}
     * @export
     * @public
     */
    function applyTradeSelectionLimits(matches, options) {
      let receive = matches.receive
      let send = matches.send
      if (options.sortMissing && options.doneMap) {
        receive = _sortMatchesByCompletion(receive, options.doneMap)
        send = _sortMatchesByCompletion(send, options.doneMap)
      }
      return {
        receive: _limitTradeStickers(receive, options.maxStickerReceive),
        send: _limitTradeStickers(send, options.maxStickerSend)
      }
    }

    /**
     * Sorts matched stickers by album completion.
     * Countries with higher completion are prioritized,
     * matching the legacy server sorting behavior.
     * @param {Object<string,number[]>} matches
     * @param {Object<string,number>} doneMap
     */
    function _sortMatchesByCompletion(matches, doneMap) {
      return Object.fromEntries(
        Object.entries(matches || {})
          .sort((a, b) => {
            const completionA = doneMap[a[0]] || 0
            const completionB = doneMap[b[0]] || 0
            return completionB - completionA
          })
      )
    }

    /**
     * Limits the number of stickers per limit provided.
     * @param {Object<string,number[]>} stickers Stickers grouped by country code.
     * @param {number} limit Maximum number of stickers to include per country.
     * @returns {Object<string,number[]>} Limited stickers grouped by country code.
     */
    function _limitTradeStickers(stickers, limit) {
      const result = {}
      let remaining = limit
      Object.keys(stickers || {}).forEach(countryCode => {
        if (remaining <= 0) return
        const selected = stickers[countryCode].slice(0, remaining)
        if (selected.length) {
          result[countryCode] = selected
          remaining -= selected.length
        }
      })
      return result
    }


    return { // namespace export
      getPayload,
      setBusy,
      setMessage,
      showMessage,
      getValidationPayload,
      renderPreview,
      clearPreview,
      clearQrPreview,
      renderQrPreview,
      formatTradeInput,
      countMatches,
      formatStickerMap,
      renderMatches,
      applyTradeSelectionLimits
    }

  })()

</script>
