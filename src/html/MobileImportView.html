<!--
  src/html/MobileImportView.html

  Import service view for the mobile web application.

  This template is injected into MobileHome.html and provides the user
  interface for importing sticker counts into the current spreadsheet.

  Responsibilities:
    - Collect import input.
    - Invoke mobile import backend services.
    - Display validation results, warnings, and import output.

  This view owns only the Import service.
  Shared navigation belongs to MobileHome.html.
-->

<!-- Import view -->
<section id="view-import" class="view card">
  <div class="section-title">Import Sticker Counts</div>

  <!-- Input sticker data -->
  <div class="field">
    <label for="textInput">Sticker data</label>
    <textarea id="textInput" placeholder="MEX,1,3-7,10&#10;MEX-1,MEX-5(2),MEX3&#10;&lt;&gt;FWC,1-10,12-19"></textarea>
  </div>

  <!-- Import Mode selector -->
  <div class="field">
    <label for="mode">Import mode</label>
    <select id="mode">
      <option value="update">Update counts</option>
      <option value="replace_countries">Update counts clearing country counts</option>
      <option value="clean_all">Import data (clears all counts first)</option>
    </select>
  </div>

  <!-- Compact format hint inline to avoid needing a separate modal on mobile -->
  <div class="format-hint">
    <strong>Format examples:</strong><br>
    <span class="ic">MEX,1,3-7,10(2)</span> &mdash; country once, comma-separated stickers<br>
    <span class="ic">MEX-1,MEX-5(2)</span> &mdash; country prefix per sticker<br>
    <span class="ic">&lt;&gt;FWC,1-10</span> &mdash; exclusion: imports all stickers <em>except</em> those
    listed
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <div class="btn-row">
      <button class="btn" onclick="previewData()">Validate / Preview</button>
      <button class="btn" onclick="clearForm()">Clear</button>
    </div>
    <button class="btn btn-primary" onclick="importData()">Import</button>
  </div>

  <!-- Feedback areas -->
  <div id="import-message" class="message info"></div>
  <div id="import-warnings" class="warnings hidden"></div>
  <pre id="import-preview" class="preview hidden"></pre>
</section>

<!-- shared helper functions for the Import view (Import namespace) -->
<?!= include('ImportHelpers') ?>

<script>
  /*
   * View controller
   *
   * Coordinates the Import view by:
   *   - handling user interactions,
   *   - invoking backend services,
   *   - rendering validation results,
   *   - updating UI state.
   */

  (function () {

    /* Element references */
    const textInputEl = document.getElementById('textInput')
    const modeInputEl = document.getElementById('mode')
    const messageEl = document.getElementById('import-message')
    const warningsEl = document.getElementById('import-warnings')
    const previewEl = document.getElementById('import-preview')

     /* Service actions
      * These functions are called by the view buttons and invoke the backend services.
      * They have global scope so they can be called from the HTML onclick attributes.
     */

    /** Validates the current import data and displays the preview. */
    window.previewData = function () {
      clearPreview()
      renderWarnings([])
      setBusy(true)
      setMessage('Validating...', 'info')

      google.script.run
        .withSuccessHandler(result => {
          setBusy(false)
          setMessage('Validation successful.', 'success')
          renderWarnings(result.warnings)
          renderPreview(result)
        })
        .withFailureHandler(err => {
          setBusy(false)
          clearPreview()
          setMessage(err && err.message ? err.message : String(err), 'error')
        })
        .previewStickerDataMobile(Import.getPayload())
    }

    /** Imports the current sticker data into the spreadsheet. */
    window.importData = function () {
      clearPreview()
      renderWarnings([])
      setBusy(true)
      setMessage('Importing...', 'info')
      google.script.run
        .withSuccessHandler(result => {
          setBusy(false)
          setMessage(result && result.message ? result.message : 'Import completed.', 'success')
          renderWarnings(result.warnings)
        })
        .withFailureHandler(err => {
          setBusy(false)
          setMessage(err && err.message ? err.message : String(err), 'error')
        })
        .importStickerDataMobile(Import.getPayload())
    }

    /** Resets the form to its initial state. */
    window.clearForm = function () {
      setBusy(false)
      if (textInputEl) { textInputEl.value = ''; textInputEl.focus() }
      if (modeInputEl) { modeInputEl.value = 'update' }
      clearPreview()
      renderWarnings([])
      setMessage('Cleared.', 'info')
    }

    /**
     * Clears the state of the import view, including messages, warnings,
     * and preview output.
     */
    window.clearImportViewState = function () {
      if (messageEl) {
        messageEl.textContent = ''
        messageEl.className = 'message info'
      }
      if (warningsEl) {
        warningsEl.textContent = ''
        warningsEl.classList.add('hidden')
      }
      if (previewEl) {
        previewEl.textContent = ''
        previewEl.classList.add('hidden')
      }
      if (textInputEl) {
        textInputEl.value = ''
      }
      if (modeInputEl) {
        modeInputEl.value = 'update'
      }
    }

    /* View helpers */

    /* Wrapper functions around shared Import helpers.
     * Wrappers keep platform-specific DOM handling inside this view.
     */
    function setMessage(text, type) {
      Import.setMessage(text, type, { messageEl })
    }

    /** Renders the import preview returned by the backend. 
     * Wrapper for shared Import.renderPreview that requires a DOM element.
    */
    function renderPreview(result) {
      Import.renderPreview(result, { previewEl })
      if (result && result.countries && result.countries.length) {
        previewEl.classList.remove('hidden')
      } else {
        previewEl.classList.add('hidden')
      }
    }

    /**
      * Enables or disables all controls in the import view.
      * @param {boolean} isBusy Whether the view is busy.
      * Note: kept local because mobile controls and layout differ from desktop.
      */
    function setBusy(isBusy) {
      const viewEl = document.getElementById('view-import')
      if (viewEl) {
        viewEl.querySelectorAll('button').forEach(btn => { btn.disabled = isBusy })
      }
      if (textInputEl) { textInputEl.disabled = isBusy }
      if (modeInputEl) { modeInputEl.disabled = isBusy }
    }

    /** Renders the warnings list returned by the backend. 
     * Note: this function is not part of the shared Import helpers because it requires a DOM element.
    */
    function renderWarnings(warnings) {
      warningsEl.textContent = ''
      if (!warnings || !warnings.length) {
        warningsEl.classList.add('hidden')
        return
      }
      warningsEl.classList.remove('hidden')
      warnings.forEach(w => {
        const p = document.createElement('p')
        p.textContent = '⚠ ' + w
        warningsEl.appendChild(p)
      })
    }

    /** Clears the preview panel. 
     * Note: kept local because mobile controls and layout differ from desktop.
    */
    function clearPreview() {
      previewEl.textContent = ''
      previewEl.classList.add('hidden')
    }

  })();
</script>
