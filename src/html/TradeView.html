<!--
  src/html/TradeView.html

  Shared Trade interface used by:
    - TradeDialog.html (desktop)
    - MobileTradeView.html (mobile web app)

  Purpose:
    - Render the Trade workflow.
    - Coordinate user interactions.
    - Invoke backend services.
    - Keep the Trade workflow consistent across desktop and mobile.

  Notes:
    - Parent containers provide platform-specific configuration.
    - The Trade workflow is implemented as multiple views within the same page.
-->

<div id="tradeInputView">

  <div class="section">
    <div class="section-title">Generate trade QR code</div>
    <div class="trade-toolbar">
      <button id="generateQrButton" class="btn btn-primary">Generate my QR code</button>
    </div>
  </div><!-- /section -->
  <div class="section">
    <div class="label-row">
      <div class="section-title">Trade information</div>
      <div class="trade-information-actions">
        <button class="btn btn-inline" onclick="clearTradeInput()">Clear</button>
        <button id="uploadQrButton" class="btn btn-inline">Upload QR image</button>
        <button id="captureQrButton" class="btn btn-inline" style="display:none;">Capture QR code</button>
      </div>
    </div>
    <div class="hint trade-import-hint">
      Enter or paste another collector's missing and repeated stickers using the same format supported by the Import
      service.
    </div>

    <label for="repeatsText">Repeats</label>
    <textarea id="repeatsText" class="form-control trade-textarea" spellcheck="false"
      placeholder="MEX,4(2),8-9(3),17(5)&#10;FWC,6(2),14(4)"></textarea>

    <label for="missingText">Missing</label>
    <textarea id="missingText" class="form-control trade-textarea" spellcheck="false"
      placeholder="MEX,1,5,12-13&#10;FWC,2,8,17-18"></textarea>

  </div><!-- /section -->

  <div id="tradeMessageSection" class="section" style="display:none;">
    <div class="section-title">Messages</div>
    <div id="trade-message" class="message info"></div>
    <div id="trade-warnings" class="message warning hidden"></div>
    <div id="trade-preview" class="preview"></div>
  </div><!-- /section -->

  <div class="section">
    <div class="section-title">Actions</div>
    <div class="actions">
      <div class="actions">
        <div class="actions">
          <button id="validateButton" class="btn btn-primary">Validate</button>
          <button class="btn" onclick="clearTradeInput()">Clear</button>
          <button id="continueButton" class="btn btn-primary">Continue</button>
          <button id="closeTradeButton" class="btn">Close</button>
        </div>
      </div>
    </div><!-- /actions -->
  </div><!-- /section -->
</div><!-- /tradeInputView -->

<div id="generateQrView" style="display:none;">
  <div class="section">
    <div class="section-title">Generate trade QR code</div>
  </div>

  <div class="section">
    <div id="tradeQrHint" class="hint" style="display:none;">
      Scan this QR code to import my trade information (repeats and missing stickers)
    </div>
    <div class="qr-container">
      <img id="tradeQrImage" class="trade-qr-image" alt="Trade QR code" style="display:none;">
    </div>
  </div>

  <div class="section">
    <div class="section-title">Messages</div>
    <div id="tradeQrMessage" class="message info"></div>
    <div id="tradeQrInfo" class="preview"></div>
  </div>

  <div class="section">
    <div class="actions">
      <button id="backQrButton" class="btn btn-primary">Back</button>
      <button id="closeQrButton" class="btn btn">Close</button>
    </div>
  </div>
</div><!-- /generateQrView -->

<?!= include('TradeHelpers') ?>

<script>

  /*
   * View controller
   *
   * Coordinates the Trade view by:
   *   - handling user interactions,
   *   - invoking backend services,
   *   - updating UI state.
   */

  (function () {

    // Trade input variables:
    const uploadQrButtonEl = document.getElementById('uploadQrButton')
    const captureQrButtonEl = document.getElementById('captureQrButton')
    const closeTradeButtonEl = document.getElementById('closeTradeButton')
    const missingTextEl = document.getElementById('missingText')
    const repeatsTextEl = document.getElementById('repeatsText')
    const validateButtonEl = document.getElementById('validateButton')
    const continueButtonEl = document.getElementById('continueButton')
    const tradeMessageSectionEl = document.getElementById('tradeMessageSection')
    const tradeMessageEl = document.getElementById('trade-message')
    const previewEl = document.getElementById('trade-preview')

    // Generate My QR code variables:
    const generateQrButtonEl = document.getElementById('generateQrButton')
    const tradeInputViewEl = document.getElementById('tradeInputView')
    const generateQrViewEl = document.getElementById('generateQrView')
    const tradeQrImageEl = document.getElementById('tradeQrImage')
    const tradeQrMessageEl = document.getElementById('tradeQrMessage')
    const tradeQrHintEl = document.getElementById('tradeQrHint')
    const tradeQrInfoEl = document.getElementById('tradeQrInfo')
    const backQrButtonEl = document.getElementById('backQrButton')
    const closeQrButtonEl = document.getElementById('closeQrButton')

    let platform = 'desktop'
    const state = { platform: 'desktop', validatedTradeInfo: null, tradeMatches: null, warnings: {} }

    // When the dialog opens, the Continue button is disabled until the user validates the trade information.
    continueButtonEl.disabled = true
    tradeMessageSectionEl.style.display = 'none'

    // Note: Below function must be place before // Wiring events because it is called by the event handlers.

    /** Returns true when running inside a spreadsheet dialog. */
    function isDesktopDialogHost() {
      return Boolean(window.google && google.script && google.script.host && google.script.host.close)
    }

    /**
    * Initializes the Trade view. Called by desktop and mobile containers.
    * @param {{platform:string}} config View configuration.
    */
    window.initializeTradeView = function (config = {}) {
      platform = config.platform || 'desktop'
      uploadQrButtonEl.style.display = platform === 'desktop' ? '' : 'none'
      captureQrButtonEl.style.display = platform === 'mobile' ? '' : 'none'
      closeTradeButtonEl.style.display = isDesktopDialogHost() ? '' : 'none'
    }

    /** Closes the Trade container when supported. */
    window.closeTradeView = function () {
      if (isDesktopDialogHost()) {
        google.script.host.close()
      }
    }

    // Wire events
    validateButtonEl.addEventListener('click', validateOtherTradeInfo)
    generateQrButtonEl.addEventListener('click', showGenerateQrView)
    backQrButtonEl.addEventListener('click', hideGenerateQrView)
    closeQrButtonEl.addEventListener('click', closeTradeView)
    //continueButtonEl.addEventListener('click', continueTrade) // removed until proposal view is implemented

    closeTradeButtonEl.addEventListener('click', closeTradeView)
    const warningsEl = document.getElementById('trade-warnings')

    /** Clears the Trade input fields and resets state. */
    window.clearTradeInput = function () {
      missingTextEl.value = ''
      repeatsTextEl.value = ''
      state.validatedTradeInfo = null
      state.warnings = {}
      continueButtonEl.disabled = true
      tradeMessageSectionEl.style.display = 'none'
      Trade.clearPreview({ previewEl })
      renderWarnings([])
      Trade.setMessage('', 'info', { messageEl: tradeMessageEl })
    }

    /** Validates the other collector information. */
    function validateOtherTradeInfo() {
      Trade.setBusy(true)
      tradeMessageSectionEl.style.display = ''
      Trade.setMessage('Validating input...', 'info', { messageEl: tradeMessageEl })
      renderWarnings([])
      Trade.clearPreview({ previewEl })
      google.script.run
        .withSuccessHandler(onOtherTradeInfoValidated)
        .withFailureHandler(onOtherTradeInfoValidationFailed)
        .previewOtherTradeInfo(Trade.getValidationPayload({
          missingText: missingTextEl,
          repeatsText: repeatsTextEl
        }))
    }

    /** Handles successful trade validation. */
    function onOtherTradeInfoValidated(result) {
      Trade.setBusy(false)
      state.validatedTradeInfo = result.tradeInfo
      state.warnings = result.warnings || {}
      continueButtonEl.disabled = false
      tradeMessageSectionEl.style.display = ''
      Trade.setMessage('Validation successful.', 'success', { messageEl: tradeMessageEl })
      renderWarnings(state.warnings)
      Trade.clearPreview({ previewEl })
      Trade.renderPreview(result, { previewEl })
    }

    /** Handles validation failure. */
    function onOtherTradeInfoValidationFailed(error) {
      Trade.setBusy(false)
      state.validatedTradeInfo = null
      continueButtonEl.disabled = true
      tradeMessageSectionEl.style.display = ''
      Trade.clearPreview({ previewEl })
      renderWarnings([])
      Trade.setMessage(error.message || String(error), 'error', { messageEl: tradeMessageEl })
    }

    /**
     * Shows the Generate QR view and generates a QR code for 
     * the current collector trade information.
     */
    function showGenerateQrView() {
      tradeInputViewEl.style.display = 'none'
      generateQrViewEl.style.display = ''
      tradeQrImageEl.style.display = 'none'
      tradeQrHintEl.style.display = 'none'
      Trade.setBusy(true)
      Trade.setMessage('Generating QR code...', 'info', { messageEl: tradeQrMessageEl })
      google.script.run
        .withSuccessHandler(onQrGenerated)
        .withFailureHandler(onQrGenerationFailed)
        .generateTradeQr()
    }

    /** Handles successful QR generation. */
    function onQrGenerated(result) {
      const tradeInfo = JSON.parse(result.tradeInfo)
      // Construct the object for Trade.renderQrPreview()
      const obj = { qrData: result.qrData, tradeInfo: tradeInfo }
      Trade.setBusy(false)
      Trade.renderQrPreview(obj, { qrEl: tradeQrImageEl, hintEl: tradeQrHintEl, infoEl: tradeQrInfoEl })
      Trade.setMessage('QR code generated successfully.', 'success', { messageEl: tradeQrMessageEl })
    }

    /** Handles QR generation failure. */
    function onQrGenerationFailed(error) {
      Trade.setBusy(false)
      Trade.setMessage(error.message || String(error), 'error', { messageEl: tradeQrMessageEl })
    }

    /** Hides the Generate QR view and returns to the Trade input view. */
    function hideGenerateQrView() {
      Trade.clearQrPreview({ qrEl: tradeQrImageEl, messageEl: tradeQrMessageEl, infoEl: tradeQrInfoEl })
      generateQrViewEl.style.display = 'none'
      tradeInputViewEl.style.display = ''
    }

    /** Finds trade matches and opens the proposal view. */
    function continueTrade() {
      if (!state.validatedTradeInfo) { return }
      Trade.setBusy(true)
      google.script.run
        .withSuccessHandler(onTradeMatchesFound)
        .withFailureHandler(onOtherTradeInfoValidationFailed)
        .findTradeMatches({ otherTradeInfo: state.validatedTradeInfo })
    }

    /** Handles calculated trade matches. */
    function onTradeMatchesFound(matches) {
      Trade.setBusy(false)
      state.tradeMatches = matches
      showProposalView(matches)
    }

    /*
     * Renders a list of warnings in the Trade view.
     * The warnings are grouped by type (missing or repeats).
     * @param {string[]} warnings List of warning messages.
     */
    function renderWarnings(warnings) {
      warningsEl.textContent = ''
      if (!warnings || (!warnings.missing?.length && !warnings.repeats?.length)) {
        warningsEl.classList.add('hidden')
        return
      }
      const missingWarnings = warnings.missing || []
      const repeatsWarnings = warnings.repeats || []
      if (!missingWarnings.length && !repeatsWarnings.length) {
        warningsEl.classList.add('hidden')
        return
      }
      warningsEl.classList.remove('hidden')
      renderWarningSection('Repeats', repeatsWarnings)
      renderWarningSection('Missing', missingWarnings)
    }

    /**
     * Renders a warning section with a title and a list of messages.
     * @param {string} title Section title.
     * @param {string[]} messages List of warning messages.
     */
    function renderWarningSection(title, messages) {
      if (!messages.length) return
      const header = document.createElement('p')
      header.style.margin = '8px 0 4px 0'
      header.style.fontWeight = 'bold'
      header.textContent = title
      warningsEl.appendChild(header)
      messages.forEach(message => {
        const p = document.createElement('p')
        p.style.margin = '2px 0'
        p.textContent = '⚠ ' + message // avoid using ${} notation
        warningsEl.appendChild(p)
      })
    }

    /**
     * Displays the trade proposal view.
     * @param {Array<{receive:string[],send:string[]}>} matches Trade matches.
     */
    function showProposalView(matches) {
      alert('Proposal screen not implemented yet.')
    }

  })()

</script>
