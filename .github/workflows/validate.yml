name: Panini WC 2026 GSheet Tracker - Validation
# .github/workflows/validate.yml

# Runs linting and tests.
# Executes for pull requests to main and for pushes to main.
# This workflow performs validation only; it never deploys.

permissions:
  contents: read # runner can only read repository contents

on:
  push: # Runs validation after every merge or direct push to 'main'
    branches:
      - main # Runs on merge or direct push to 'main'

  pull_request: # Runs validation for pull requests targeting 'main'
    branches:
      - main # Runs validation on PRs targeting 'main'

jobs:
  validate: # Test and lint, but do not deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      # 2. Setup common project environment
      - name: Setup Project Environment
        uses: ./.github/actions/setup-project

      # 3. Setup Python runtime for roster validation script
      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Python runtime for data/clean_roster.py

      # 4. Run roster cleanup validation script
      # If the script raises SystemExit(1), this step fails and blocks the workflow.
      - name: Run Roster Cleanup Validation
        run: python data/clean_roster.py

      # 5. Run ESLint
      - name: Run ESLint Quality Check
        run: npm run lint

      # 6. Build project and execute unit tests
      - name: Project Build and Run Jest Testing Suites
        run: npm test