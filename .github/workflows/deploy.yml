name: Panini WC 2026 GSheet Tracker - Production Deployment
# .github/workflows/deploy.yml

# Deploys the production Google Apps Script project.
# Runs automatically for pushes to main that modify deployable source files (see paths below), and can also be
# run on demand from the Actions tab (workflow_dispatch) for cases the path filter deliberately excludes - e.g.
# a scripts/clasp.zsh or docs/-only change, which doesn't affect the deployed app itself but may still need a
# real push+deploy exercised to confirm it works (see docs/TechnicalArchitecture.md's FAQ for an example: the
# Node-version fix in scripts/clasp.zsh). Manual runs always use whatever is currently on the selected branch -
# normally 'main', to match the production SCRIPT_ID/DEPLOYMENT_ID secrets/config this workflow assumes.

permissions:
  contents: read # runner can only read repository contents

on:
  push: # Triggers immediately when code lands on 'main'
    branches:
      - main # Runs on merge or direct push to 'main'
    paths: # Only run this deployment workflow when these paths change
      - 'src/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/setup-project/**'
  workflow_dispatch: # Manual "Run workflow" button in the Actions tab - bypasses the paths filter above entirely

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      # 2. Setup common project environment
      - name: Setup Project Environment
        uses: ./.github/actions/setup-project

      # 3. Install zsh
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # 4. Install clasp CLI
      - name: Install clasp CLI
        run: npm install -g @google/clasp

      # 5. Inject clasp credentials
      - name: Inject Clasp Authentication Tokens
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON_SECRET }}' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      # 6. Write the production clasp config file from secrets (clasp.zsh requires --env/--file; production
      #    scriptId/deploymentId are secrets, so they can never live in a tracked scripts/*_clasp.cfg.zsh file -
      #    this writes them to a runner-temp file instead, mirroring the .clasprc.json step above)
      - name: Write Production Clasp Config
        env:
          SCRIPT_ID: ${{ secrets.PRODUCTION_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.PRODUCTION_DEPLOYMENT_ID }}
        run: |
          echo "SCRIPT_ID=\"$SCRIPT_ID\"" > "$RUNNER_TEMP/prod_clasp.cfg.zsh"
          echo "DEPLOYMENT_ID=\"$DEPLOYMENT_ID\"" >> "$RUNNER_TEMP/prod_clasp.cfg.zsh"
          echo 'DEPLOYMENT_NAME="template panini_FWC 2026"' >> "$RUNNER_TEMP/prod_clasp.cfg.zsh"

      # 7. Push project source to the Google Apps Script project
      - name: Push Code Artifacts to GAS Production Server
        run: zsh scripts/clasp.zsh push --file "$RUNNER_TEMP/prod_clasp.cfg.zsh"

      # 8. Create a new deployment version of the Apps Script Web App
      - name: Deploy Web App for Mobile Services
        run: zsh scripts/clasp.zsh deploy --file "$RUNNER_TEMP/prod_clasp.cfg.zsh"